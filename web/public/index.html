<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>如视 VR 合影生成器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f6f7;
      margin: 0;
      padding: 24px;
      color: #1a1a1a;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 24px; }
    .container {
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      border: 1px dashed #d0d5dd;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: #2d8cf0; }
    .card h3 { margin: 0 0 12px; font-size: 16px; }
    .card input[type="file"] { display: none; }
    .card label {
      display: inline-block;
      padding: 8px 16px;
      background: #2d8cf0;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .card label:hover { background: #1c75d8; }
    .preview {
      margin-top: 16px;
      max-height: 220px;
      overflow: hidden;
      border-radius: 8px;
      background: #f5f6f7;
      display: none;
    }
    .preview img { width: 100%; height: 100%; object-fit: contain; }
    .preview.show { display: block; }
    .params {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .field { display: flex; flex-direction: column; }
    .field label { font-size: 13px; color: #4b5563; margin-bottom: 6px; }
    .field input, .field select {
      padding: 10px 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 14px;
    }
    .field input[type="checkbox"] { width: 20px; height: 20px; }
    .checkbox { flex-direction: row; align-items: center; gap: 8px; }
    .actions { text-align: center; margin-bottom: 24px; }
    .actions button {
      padding: 12px 32px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .actions button:disabled { background: #9ca3af; cursor: not-allowed; }
    .actions button:hover:not(:disabled) { background: #059669; }
    .result {
      display: none;
      text-align: center;
      padding: 24px;
      background: #f0fdf4;
      border-radius: 10px;
    }
    .result.show { display: block; }
    .result img { max-width: 100%; border-radius: 8px; margin-top: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .status { color: #4b5563; margin-top: 12px; font-size: 14px; }
    .error { color: #ef4444; background: #fef2f2; padding: 12px; border-radius: 8px; margin-top: 16px; display: none; }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📸 如视 VR 实景合影生成器</h1>
    <p class="subtitle">上传人物照片和 VR 全景图，一键生成在如视场景中的合影。</p>

    <div class="grid">
      <div class="card">
        <h3>1. 上传人物照片</h3>
        <input type="file" id="personFile" accept="image/*" onchange="onUpload('person')">
        <label for="personFile">选择照片</label>
        <div id="personPreview" class="preview"></div>
        <p id="personPath" style="font-size:12px;color:#666;margin-top:8px;"></p>
      </div>
      <div class="card">
        <h3>2. 上传/选择全景图</h3>
        <input type="file" id="sceneFile" accept="image/*" onchange="onUpload('scene')">
        <label for="sceneFile">选择全景图</label>
        <div id="scenePreview" class="preview"></div>
        <p id="scenePath" style="font-size:12px;color:#666;margin-top:8px;"></p>
      </div>
    </div>

    <div class="params">
      <div class="field">
        <label for="yaw">水平视角 (yaw)</label>
        <input type="number" id="yaw" value="0" step="1">
      </div>
      <div class="field">
        <label for="pitch">垂直视角 (pitch)</label>
        <input type="number" id="pitch" value="0" step="1">
      </div>
      <div class="field">
        <label for="distance">距离 (distance)</label>
        <input type="number" id="distance" value="3" step="0.5">
      </div>
      <div class="field">
        <label for="scale">缩放 (scale, 可选)</label>
        <input type="number" id="scale" placeholder="自动" step="0.01">
      </div>
      <div class="field checkbox">
        <input type="checkbox" id="shadow" checked>
        <label for="shadow">地面阴影</label>
      </div>
      <div class="field checkbox">
        <input type="checkbox" id="lighting" checked>
        <label for="lighting">光影融合</label>
      </div>
    </div>

    <div class="actions">
      <button id="generateBtn" onclick="generate()">生成合影</button>
    </div>

    <div id="result" class="result">
      <h3>生成成功 🎉</h3>
      <div id="resultMeta" class="status"></div>
      <img id="resultImg" src="" alt="合影结果">
    </div>
    <div id="error" class="error"></div>
  </div>

  <script>
    const uploads = { person: null, scene: null }

    async function onUpload(type) {
      const input = document.getElementById(type + 'File')
      if (!input.files || !input.files[0]) return
      const file = input.files[0]
      const form = new FormData()
      form.append('type', type)
      form.append(type, file)
      try {
        const res = await fetch('/api/upload', { method: 'POST', body: form })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error)
        uploads[type] = data.path
        document.getElementById(type + 'Path').textContent = data.path
        const preview = document.getElementById(type + 'Preview')
        preview.innerHTML = `<img src="${URL.createObjectURL(file)}" alt="preview">`
        preview.classList.add('show')
      } catch (e) {
        showError('上传失败：' + e.message)
      }
    }

    async function generate() {
      if (!uploads.person || !uploads.scene) {
        showError('请先上传人物照片和全景图')
        return
      }
      const btn = document.getElementById('generateBtn')
      btn.disabled = true
      btn.textContent = '生成中...'
      hideError()
      document.getElementById('result').classList.remove('show')

      const params = {
        personPath: uploads.person,
        scenePath: uploads.scene,
        yaw: Number(document.getElementById('yaw').value),
        pitch: Number(document.getElementById('pitch').value),
        distance: Number(document.getElementById('distance').value),
        scale: document.getElementById('scale').value ? Number(document.getElementById('scale').value) : undefined,
        shadow: document.getElementById('shadow').checked,
        lighting: document.getElementById('lighting').checked,
      }

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(params),
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error)
        document.getElementById('resultMeta').textContent = `分辨率: ${data.width} x ${data.height}`
        document.getElementById('resultImg').src = data.previewUrl + '?t=' + Date.now()
        document.getElementById('result').classList.add('show')
      } catch (e) {
        showError('生成失败：' + e.message)
      } finally {
        btn.disabled = false
        btn.textContent = '生成合影'
      }
    }

    function showError(msg) {
      const el = document.getElementById('error')
      el.textContent = msg
      el.classList.add('show')
    }
    function hideError() {
      const el = document.getElementById('error')
      el.classList.remove('show')
    }
  </script>
</body>
</html>
