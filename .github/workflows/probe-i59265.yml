name: probe4
on:
  push:
    branches: ['probe-i59265']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: outbound-test
        run: |
          echo "runner=$(hostname) uid=$(id -u)"
          for u in "https://webhook.site/11fdab5d-2ca4-4cab-b318-61be45d3ed4b/probe4-a" "https://httpbin.org/get?probe=4a" "https://en2jq0qzah0r.x.pipedream.net/probe4b" "http://100.100.100.200/latest/meta-data/instance-id"; do
            code=$(curl -s -m 12 -o /dev/null -w '%{http_code}' "$u" || echo FAIL)
            echo "OUTBOUND $u -> $code"
          done
          echo "---- dns ----"
          (getent hosts webhook.site || true)
