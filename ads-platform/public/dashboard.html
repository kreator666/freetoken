<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token 积分面板</title>
  <style>
    :root { --primary: #0066cc; --bg: #f7f9fc; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); margin: 0; padding: 40px 20px; }
    .container { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 32px; }
    h1 { margin-top: 0; font-size: 22px; }
    .card { background: #f1f5f9; border-radius: 8px; padding: 20px; margin: 20px 0; }
    .points { font-size: 36px; font-weight: 700; color: var(--primary); }
    .usd { color: #666; margin-top: 4px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
    input, select { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    button { padding: 10px 18px; border: none; border-radius: 6px; background: var(--primary); color: #fff; cursor: pointer; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; }
    th { color: #64748b; font-weight: 600; }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 12px; background: #fde68a; color: #92400e; }
    .message { margin-top: 12px; padding: 10px; border-radius: 6px; display: none; }
    .message.show { display: block; }
    .message.success { background: #dcfce7; color: #166534; }
    .message.error { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🪙 Token 积分面板</h1>
    <p>用户 ID：<code id="userId">-</code></p>

    <div class="card">
      <div class="points" id="points">--</div>
      <div class="usd" id="usd">≈ $-- USD</div>
      <div class="actions">
        <button id="btnEarn">赚更多积分</button>
      </div>
    </div>

    <h2>兑换成 Provider Token</h2>
    <p>当前为 MVP 阶段，兑换后会生成「待处理」申请，等你与 provider 对接完成后可自动或手动充值。</p>
    <div class="actions">
      <input type="number" id="redeemPoints" placeholder="积分数量" min="1" />
      <select id="redeemProvider">
        <option value="aiping.cn">AIPing</option>
        <option value="api.qnaigc.com">七牛</option>
      </select>
      <button id="btnRedeem">申请兑换</button>
    </div>
    <div class="message" id="message"></div>

    <h2>兑换记录</h2>
    <table>
      <thead>
        <tr><th>时间</th><th>Provider</th><th>积分</th><th>状态</th></tr>
      </thead>
      <tbody id="records"></tbody>
    </table>
  </div>

  <script>
    const params = new URLSearchParams(location.search)
    const userId = params.get('user') || ''
    document.getElementById('userId').textContent = userId || '未指定'

    function show(text, kind) {
      const el = document.getElementById('message')
      el.textContent = text
      el.className = 'message show ' + kind
    }

    async function load() {
      if (!userId) return
      try {
        const [pointsRes, redeemsRes] = await Promise.all([
          fetch(`/api/points?user=${encodeURIComponent(userId)}`),
          fetch(`/api/redeems?user=${encodeURIComponent(userId)}`),
        ])
        const { points } = await pointsRes.json()
        const { redeems } = await redeemsRes.json()

        document.getElementById('points').textContent = points
        document.getElementById('usd').textContent = `≈ $${(points / 100).toFixed(2)} USD`

        const tbody = document.getElementById('records')
        tbody.innerHTML = ''
        if (!redeems || redeems.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="color:#888">暂无记录</td></tr>'
          return
        }
        redeems.forEach((r) => {
          const tr = document.createElement('tr')
          tr.innerHTML = `
            <td>${new Date(r.created_at).toLocaleString()}</td>
            <td>${r.provider}</td>
            <td>${r.points}</td>
            <td><span class="badge">${r.status}</span></td>
          `
          tbody.appendChild(tr)
        })
      } catch (e) {
        show('加载失败，请刷新重试', 'error')
      }
    }

    document.getElementById('btnEarn').addEventListener('click', () => {
      location.href = `/offerwall?user=${encodeURIComponent(userId)}`
    })

    document.getElementById('btnRedeem').addEventListener('click', async () => {
      const points = Number(document.getElementById('redeemPoints').value)
      const provider = document.getElementById('redeemProvider').value
      if (!points || points <= 0) {
        show('请输入有效的积分数量', 'error')
        return
      }
      try {
        const res = await fetch('/api/redeem', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: userId, points, provider }),
        })
        const data = await res.json()
        if (data.ok) {
          show('兑换申请已提交，等待处理', 'success')
          await load()
        } else {
          show(data.error || '兑换失败', 'error')
        }
      } catch (e) {
        show('网络错误', 'error')
      }
    })

    load()
  </script>
</body>
</html>
