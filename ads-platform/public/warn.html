<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token 余额不足</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9182114044842801"
     crossorigin="anonymous"></script>
  <style>
    :root { --primary: #0066cc; --danger: #d93025; --bg: #f7f9fc; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); margin: 0; padding: 40px 20px; }
    .container { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 32px; }
    h1 { margin-top: 0; color: var(--danger); font-size: 22px; }
    p { color: #444; line-height: 1.6; }
    .meta { background: #f1f5f9; border-radius: 8px; padding: 16px; margin: 20px 0; }
    .meta div { display: flex; justify-content: space-between; margin: 6px 0; }
    .meta span { color: #666; }
    .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
    button { padding: 14px 20px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; transition: opacity .2s; }
    button:hover { opacity: .9; }
    .primary { background: var(--primary); color: #fff; }
    .secondary { background: #e2e8f0; color: #334155; }
    .message { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; }
    .message.show { display: block; }
    .message.success { background: #dcfce7; color: #166534; }
    .message.info { background: #dbeafe; color: #1e40af; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚠️ Token 余额不足</h1>
    <p>你当前使用的模型 provider 余额（或用量）已低于设定阈值，继续使用可能会被中断。</p>

    <div class="meta">
      <div><span>Provider</span><strong id="providerName">-</strong></div>
      <div><span>当前状态</span><strong id="currentValue">-</strong></div>
      <div><span>触发阈值</span><strong id="thresholdValue">-</strong></div>
      <div><span>用户 ID</span><code id="userId">-</code></div>
    </div>

    <div class="actions">
      <button class="primary" id="btnEarn">看广告赚积分</button>
      <button class="secondary" id="btnSnooze">30 分钟内不再提示</button>
      <button class="secondary" id="btnDashboard">查看积分 / 兑换</button>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search)
    const provider = params.get('provider') || 'unknown'
    const providerName = params.get('name') || provider
    const balance = params.get('balance') || '-'
    const threshold = params.get('threshold') || '-'
    const userId = params.get('user') || '-'
    const type = params.get('type') || 'balance'

    document.getElementById('providerName').textContent = providerName
    document.getElementById('currentValue').textContent = type === 'usage' ? `24h 用量 ${balance}` : `余额 ${balance}`
    document.getElementById('thresholdValue').textContent = threshold
    document.getElementById('userId').textContent = userId

    function show(text, kind = 'info') {
      const el = document.getElementById('message')
      el.textContent = text
      el.className = 'message show ' + kind
    }

    document.getElementById('btnEarn').addEventListener('click', () => {
      location.href = `/offerwall?user=${encodeURIComponent(userId)}&provider=${encodeURIComponent(provider)}`
    })

    document.getElementById('btnSnooze').addEventListener('click', async () => {
      try {
        const res = await fetch(`/api/snooze?user=${encodeURIComponent(userId)}&provider=${encodeURIComponent(provider)}&minutes=30`, { method: 'POST' })
        const data = await res.json()
        if (data.ok) {
          show('已设置 30 分钟内不再提示。', 'success')
        } else {
          show('设置失败：' + (data.error || '未知错误'))
        }
      } catch (e) {
        show('网络错误，请稍后重试')
      }
    })

    document.getElementById('btnDashboard').addEventListener('click', () => {
      location.href = `/dashboard.html?user=${encodeURIComponent(userId)}`
    })
  </script>
</body>
</html>
